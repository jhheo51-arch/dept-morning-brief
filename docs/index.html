<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>백화점 아침 점검</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f4f3ef; --card:#ffffff; --ink:#1e1e1e; --ink2:#4a4a4a; --muted:#767676; --line:#e4e2dc; --grid:#ecebe6;
  --green:#1e9d8b; --green-d:#13806f; --mint:#e3f3f0; --orange:#ca7700; --orange-d:#a86200; --warm:#f7e8cf;
  --gray:#c4c4c0; --virtual:#a86200; --virtual-bg:#f7e8cf; --band:#13806f; --band-ink:#ffffff; --band-sub:#d3eee9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131615; --card:#1c201f; --ink:#e8ebe9; --ink2:#c2c8c5; --muted:#949c99; --line:#2e3432; --grid:#262b29;
    --green:#26a491; --green-d:#5cc4b3; --mint:#173430; --orange:#c97f12; --orange-d:#e0a04a; --warm:#3a2c16;
    --gray:#4a514e; --virtual:#e0a04a; --virtual-bg:#3a2c16; --band:#0f5f53; --band-ink:#ffffff; --band-sub:#bfe5de;
  }
}
:root[data-theme="dark"]{
  --bg:#131615; --card:#1c201f; --ink:#e8ebe9; --ink2:#c2c8c5; --muted:#949c99; --line:#2e3432; --grid:#262b29;
  --green:#26a491; --green-d:#5cc4b3; --mint:#173430; --orange:#c97f12; --orange-d:#e0a04a; --warm:#3a2c16;
  --gray:#4a514e; --virtual:#e0a04a; --virtual-bg:#3a2c16; --band:#0f5f53; --band-ink:#ffffff; --band-sub:#bfe5de;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; word-break:keep-all}
.wrap{max-width:1080px; margin:0 auto; padding:28px 24px 64px}
header.top{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px;
  background:var(--band); color:var(--band-ink); border-radius:12px; padding:22px 26px 20px; border-bottom:5px solid var(--orange)}
.brand{font-size:13px; font-weight:700; color:var(--band-sub)}
h1{font-size:26px; margin:4px 0 0; letter-spacing:-.02em}
.how{font-size:13px; color:var(--band-sub); margin-top:6px}
.meta{font-size:13px; color:var(--band-sub); text-align:right}
.theme-btn{margin-top:6px; background:none; border:1px solid var(--band-sub); color:var(--band-ink); border-radius:6px; padding:4px 10px; font:inherit; font-size:12px; cursor:pointer}
.headline{background:var(--card); border-left:6px solid var(--green); border-radius:10px; padding:18px 22px; margin-bottom:16px}
.headline .q{font-size:13px; color:var(--green-d); font-weight:700}
.headline ol{margin:6px 0 0; padding-left:22px; font-size:17px; font-weight:600; line-height:1.6}
.headline .sum{margin:10px 0 0; color:var(--ink2); font-size:14px}
.headline .by{font-size:12px; color:var(--muted)}
.alert{background:var(--warm); border-left:6px solid var(--orange); border-radius:10px; padding:12px 18px; margin-bottom:16px; font-size:14px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px}
.card{background:var(--card); border-radius:10px; padding:18px 20px 14px; min-width:0}
.card h3{font-size:16px; margin:0; padding-left:10px; border-left:4px solid var(--green); line-height:1.25}
.card .sub{font-size:13px; color:var(--muted); margin:2px 0 10px}
.v{font-size:11px; font-weight:700; color:var(--virtual); background:var(--virtual-bg); border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:2px}
.tag{display:inline-block; font-size:12px; font-weight:700; border-radius:4px; padding:1px 7px; margin-left:6px; vertical-align:2px}
.tag.ok{background:var(--mint); color:var(--green-d)} .tag.warn{background:var(--warm); color:var(--orange-d)}
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:6px 0 8px}
.kpi{border-top:3px solid var(--gray); padding-top:6px}
.kpi.g{border-top-color:var(--green)} .kpi.o{border-top-color:var(--orange)}
.kpi .l{font-size:12.5px; color:var(--muted)}
.kpi .n{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums}
.kpi .n small{font-size:13px; font-weight:600; margin-left:2px}
.kpi .s{font-size:12px; color:var(--ink2)}
.kpi.g .n{color:var(--green-d)} .kpi.o .n{color:var(--orange-d)}
ul.plain{margin:4px 0; padding-left:18px; font-size:14px} ul.plain li{margin:3px 0}
.src{font-size:12px; color:var(--muted); border-top:1px solid var(--line); margin-top:10px; padding-top:8px}
.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
.tbl th,.tbl td{text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top}
.tbl th{font-size:12px; color:var(--muted); font-weight:600}
.tbl tr.today td{background:var(--mint)}
.tbl td.r,.tbl th.r{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.tbl td.bad{color:var(--orange-d); font-weight:700}
.warnline{display:block; font-size:12.5px; color:var(--orange-d); font-weight:600}
.empty{font-size:14px; color:var(--ink2); background:var(--bg); border-radius:8px; padding:12px 14px; margin-top:8px}
.empty code{font-size:13px}
.memo{white-space:pre-wrap; background:var(--bg); border-radius:8px; padding:10px 12px; font-size:13px; line-height:1.6; margin:6px 0 0}
.copy{font:inherit; font-size:12px; border:1px solid var(--line); background:var(--card); color:var(--ink2); border-radius:6px; padding:2px 8px; margin-left:8px; cursor:pointer}
details.draft{border-top:1px solid var(--line); padding:8px 0}
details.draft summary{cursor:pointer; font-weight:700}
.tbl td.d{white-space:nowrap; font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.chart svg{display:block; width:100%; height:auto}
.axis text{fill:var(--muted); font-size:10px}
.legend{display:flex; gap:14px; font-size:12.5px; color:var(--ink2); margin:4px 0}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; margin-right:5px}
footer{font-size:13px; color:var(--muted); text-align:center; margin-top:24px}
@media (max-width:760px){
  .wrap{padding:16px 16px 48px} .grid2{grid-template-columns:1fr} .meta{text-align:left}
  .kpis{grid-template-columns:repeat(3,1fr)} .kpi .n{font-size:22px} .headline ol{font-size:15.5px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand" id="brand">백화점 마케팅 아침 점검</div>
      <h1 id="title">아침 점검</h1>
      <div class="how" id="how"></div>
    </div>
    <div class="meta"><div id="runat"></div><button class="theme-btn" id="theme">화면 밝기 바꾸기</button></div>
  </header>
  <div id="alerts"></div>
  <section class="headline">
    <div class="q">오늘 볼 것 세 가지</div>
    <ol id="top3"></ol>
    <p class="sum" id="summary"></p>
    <div class="by" id="by"></div>
  </section>
  <section class="card" id="sales" style="margin-bottom:16px"></section>
  <div class="grid2">
    <section class="card" id="promos"></section>
    <section class="card" id="c44"></section>
  </div>
  <section class="card" id="c42" style="margin-bottom:16px"></section>
  <div class="grid2">
    <section class="card" id="touch"></section>
    <section class="card" id="weekly"></section>
  </div>
  <section class="card" id="consult" style="margin-bottom:16px"></section>
  <div class="grid2">
    <section class="card" id="c41"></section>
    <section class="card" id="c43"></section>
  </div>
  <section class="card" id="hist"></section>
  <footer id="foot"></footer>
</div>
<script src="data.js"></script>
<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('theme');
  try{var t=localStorage.getItem('theme'); if(t) root.setAttribute('data-theme',t);}catch(e){}
  btn.onclick=function(){
    var dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
    var n=dark?'light':'dark'; root.setAttribute('data-theme',n); try{localStorage.setItem('theme',n);}catch(e){}
  };
  var B=window.BRIEF, $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fmt(n){return n==null?'-':Number(n).toLocaleString('ko-KR')}
  if(!B){ $('top3').innerHTML='<li>브리핑 파일을 읽지 못했습니다. 저장소의 data/latest.json 을 확인해 주세요.</li>'; return; }
  var DOW='월화수목금토일';
  var d=new Date(B.date+'T00:00:00');
  $('title').textContent=B.date.replace(/-/g,'. ')+' ('+DOW[(d.getDay()+6)%7]+') 아침 점검';
  $('runat').textContent='실행 '+B.run_at.replace('T',' ').slice(0,16)+' KST';
  var SAMPLE=B.mode!=='real', VT=SAMPLE?'<span class="v">가상 데이터</span>':'';
  document.title=(B.store_name?B.store_name+' ':'')+'아침 점검';
  $('brand').textContent=SAMPLE?'백화점 마케팅 아침 점검 | 개인 포트폴리오 시연':'백화점 마케팅 아침 점검 | '+(B.store_name||'내 점포');
  $('how').textContent=SAMPLE
    ?'매출과 행사는 가상 시연 파일, 리뷰와 날씨는 공개 자료입니다. 내 엑셀을 넣으면 같은 화면이 내 자료로 바뀝니다.'
    :'inputs 폴더의 내 엑셀로 만든 화면입니다. 내부 자료이니 외부에 공유하지 마세요.';
  var repo=B.repo_url?'<br>판단 규칙과 코드: <a href="'+esc(B.repo_url)+'">'+esc(B.repo_url.replace(/^https?:\/\//,''))+'</a>':'';
  $('foot').innerHTML=(SAMPLE?'공개 데이터와 가상 데이터만 씁니다. 현대백화점 내부 자료가 아닙니다.':'내 파일로 만든 점검입니다. 판단은 규칙 문장대로이며, 최종 결정은 담당자가 합니다.')+repo;
  var al='';
  if(B.error) al+='<div class="alert"><b>실행 실패</b> '+esc(B.error.at)+', 실패 단계 '+esc(B.error.step)+'. 아래는 마지막 성공('+esc(B.error.last_success)+') 결과입니다.</div>';
  (B.failures||[]).forEach(function(f){ al+='<div class="alert"><b>'+esc(f.step)+' 실패</b>'+(f.message?': '+esc(f.message):'')+'. 마지막 성공 '+esc(f.last_success||'없음')+', 해당 블록은 그때 결과이거나 비어 있습니다.</div>'; });
  $('alerts').innerHTML=al;
  $('top3').innerHTML=(B.top3||[]).map(function(t){return '<li>'+esc(t)+'</li>'}).join('');
  $('summary').textContent=B.summary||'';
  $('by').textContent='요약: '+(B.summary_by||'');
  function src(rule,s){return '<div class="src">규칙 '+esc(rule)+' | 출처 '+esc(s)+'</div>'}
  function pct(n){return n==null?'-':(n>0?'+':'')+n+'%'}
  function missing(name,what){
    if((B.missing||[]).indexOf(name+'.xlsx')<0) return '';
    return '<div class="empty"><b>'+esc(what)+'</b> 파일이 아직 없습니다. <code>inputs/'+esc(name)+'.xlsx</code>(또는 .csv)를 넣으면 다음 실행부터 나옵니다. 양식은 <code>python -m brief.init</code> 으로 만듭니다.</div>';
  }

  // 매출 현황
  var S=B.sales, h='<h3>매출 현황'+VT+'</h3>';
  if(S){
    var t=S.total, m=S.mtd, w=S.last7;
    h+='<div class="sub">'+esc(S.date)+' 마감 기준'+(S.stale_days>1?' ('+S.stale_days+'일 전 자료)':'')
      +'<span class="tag '+(S.status==='확인 필요'?'warn':'ok')+'">'+esc(S.status)+'</span></div>';
    function k(lab,n,unit,sub,cls){return '<div class="kpi '+(cls||'')+'"><div class="l">'+lab+'</div><div class="n">'+n+(unit?'<small>'+unit+'</small>':'')+'</div><div class="s">'+sub+'</div></div>'}
    var lowA=t.achieve_pct!=null&&t.achieve_pct<S.target_alert_pct, lowY=t.yoy_pct!=null&&t.yoy_pct<=S.yoy_alert_pct;
    h+='<div class="kpis">'+k('어제 매출',esc(t.sales_text),'','목표 '+(t.achieve_pct==null?'없음':t.achieve_pct+'%'),lowA?'o':'g')
      +k('전년 같은 날 대비',t.yoy_pct==null?'-':pct(t.yoy_pct),'','최근 7일 '+pct(w.yoy_pct),lowY?'o':'g')
      +k('월 누계',esc(m.sales_text),'','목표 '+(m.achieve_pct==null?'-':m.achieve_pct+'%')+', 전년 대비 '+pct(m.yoy_pct))+'</div>';
    if(S.reasons.length) h+='<ul class="plain">'+S.reasons.map(function(x){return '<li>판단 근거: '+esc(x)+'</li>'}).join('')+'</ul>';
    if(S.parts.length){
      h+='<div class="scroll"><table class="tbl"><tr><th>구분</th><th class="r">어제 매출</th><th class="r">목표 달성</th><th class="r">전년 대비</th><th>볼 점</th></tr>'
        +S.parts.map(function(p){return '<tr><td><b>'+esc(p.part)+'</b></td><td class="r">'+esc(p.sales_text)+'</td><td class="r'+(p.achieve_pct!=null&&p.achieve_pct<S.target_alert_pct?' bad':'')+'">'+(p.achieve_pct==null?'-':p.achieve_pct+'%')
          +'</td><td class="r'+(p.yoy_pct!=null&&p.yoy_pct<=S.yoy_alert_pct?' bad':'')+'">'+pct(p.yoy_pct)+'</td><td>'+(esc(p.flags.join(', '))||'-')+'</td></tr>'}).join('')+'</table></div>';
    }
    var sr=S.series30||[];
    if(sr.length>1){
      var W=960,H=150,pl=44,pb=22, mx=Math.max.apply(null,sr.map(function(x){return Math.max(x.sales||0,x.prev||0,x.target||0)}))||1, bw=(W-pl)/sr.length;
      var sv='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="최근 30일 일별 매출과 전년 같은 날 매출">';
      [0,.5,1].forEach(function(q){var y=H-pb-(H-pb-8)*q; sv+='<g class="axis"><line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)"/><text x="'+(pl-6)+'" y="'+(y+3)+'" text-anchor="end">'+(mx*q/1e8).toFixed(1)+'억</text></g>'});
      var line='';
      sr.forEach(function(x,i){
        var x0=pl+i*bw+1, hh=(H-pb-8)*(x.sales||0)/mx, under=x.target&&x.sales<x.target*S.target_alert_pct/100;
        sv+='<rect x="'+x0+'" y="'+(H-pb-hh)+'" width="'+(bw-2)+'" height="'+hh+'" fill="var('+(under?'--orange':'--green')+')"><title>'+x.date+' 매출 '+fmt(x.sales)+'원'+(x.prev?', 전년 '+fmt(x.prev)+'원':'')+(x.target?', 목표 '+fmt(x.target)+'원':'')+'</title></rect>';
        if(x.prev) line+=(line?'L':'M')+(x0+bw/2-1)+' '+(H-pb-(H-pb-8)*x.prev/mx);
        if((sr.length-1-i)%7===0) sv+='<text class="axis" x="'+(x0+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" fill="var(--muted)" font-size="10">'+x.date.slice(5).replace('-','/')+'</text>';
      });
      if(line) sv+='<path d="'+line+'" fill="none" stroke="var(--ink2)" stroke-width="1.5" stroke-dasharray="3 3"/>';
      sv+='</svg>';
      h+='<div class="legend" style="margin-top:10px"><span><i style="background:var(--green)"></i>일별 매출</span><span><i style="background:var(--orange)"></i>목표 '+S.target_alert_pct+'% 미만인 날</span><span><i style="background:var(--ink2)"></i>점선은 전년 같은 날</span></div><div class="chart">'+sv+'</div>';
    }
    h+=src(S.rule+' ('+esc(S.rule_text)+')', S.source);
  } else h+=missing('sales','매출')||'<div class="empty">매출 파일을 읽지 못했습니다. 위 실패 안내의 행 번호를 고쳐 주세요.</div>';
  $('sales').innerHTML=h;

  // 행사 점검
  var Pr=B.promos; h='<h3>프로모션과 행사 점검'+VT+'</h3>';
  if(Pr){
    h+='<div class="sub">진행 중 '+Pr.running+'건, 7일 안 시작 '+Pr.upcoming+'건<span class="tag '+(Pr.warn_count?'warn':'ok')+'">'+(Pr.warn_count?'경고 '+Pr.warn_count+'건':'평소')+'</span></div>';
    if(Pr.items.length){
      h+='<table class="tbl"><tr><th>행사</th><th>단계</th><th>VMD와 알릴 길</th></tr>'+Pr.items.map(function(i){
        return '<tr><td><b>'+esc(i.name)+'</b>'+(i.place?'<br><span class="sub">'+esc(i.place)+(i.owner?', '+esc(i.owner):'')+'</span>':'')+'</td><td class="d">'+esc(i.phase)+'<br><span class="sub">'+esc(i.start.slice(5).replace('-','/'))+'~'+esc(i.end.slice(5).replace('-','/'))+'</span></td><td>'
          +'VMD '+(esc(i.vmd)||'-')+'<br>'+(esc(i.channel)||'알릴 길 -')+i.warns.map(function(x){return '<span class="warnline">'+esc(x)+'</span>'}).join('')+'</td></tr>'}).join('')+'</table>';
    } else h+='<div class="empty">진행 중이거나 7일 안에 시작하는 행사가 없습니다.</div>';
    h+=src(Pr.rule+' ('+esc(Pr.rule_text)+')', Pr.source);
  } else h+=missing('promotions','행사')||'<div class="empty">행사 파일을 읽지 못했습니다. 위 실패 안내를 확인해 주세요.</div>';
  var R=B.promo_results;
  if(R&&R.items.length){
    h+='<h3 style="margin-top:16px">행사 성과'+VT+'</h3><div class="sub">행사 기간 매출과 바로 앞 같은 요일 기간 매출<span class="tag '+(R.status==='확인 필요'?'warn':'ok')+'">'+esc(R.status)+'</span></div>';
    h+='<div class="scroll"><table class="tbl"><tr><th>행사</th><th class="r">행사 기간</th><th class="r">앞 기간</th><th class="r">차이</th></tr>'+R.items.map(function(i){
      var md=function(x){return esc(x.slice(5).replace('-','/'))};
      return '<tr><td><b>'+esc(i.name)+'</b><br><span class="sub">'+esc(i.part||'전체')+', '+md(i.start)+'~'+md(i.to)+(i.ended?' 종료':' 진행 중')+'</span></td>'
        +'<td class="r">'+(esc(i.sales_text)||'-')+'</td><td class="r">'+(esc(i.base_text)||'-')+'<br><span class="sub">'+md(i.base_from)+'~'+md(i.base_to)+'</span></td>'
        +'<td class="r'+(i.flag?' bad':'')+'">'+(i.note?esc(i.note):pct(i.growth))+'</td></tr>'}).join('')+'</table></div>';
    h+=src(R.rule_text, R.source);
  }
  $('promos').innerHTML=h;

  // 접점 숫자
  var Tc=B.touch; h='<h3>접점 숫자'+VT+'</h3><div class="sub">문화센터, 라운지, 상담실처럼 매일 세는 숫자</div>';
  if(Tc){
    h+='<div class="sub">'+(Tc.flagged.length?'<span class="tag warn">평소와 다름 '+Tc.flagged.length+'건</span>':'<span class="tag ok">평소</span>')+'</div>';
    if(Tc.items.length){
      h+='<div class="scroll"><table class="tbl"><tr><th>접점</th><th>지표</th><th class="r">최근 값</th><th class="r">평소</th><th class="r">변화</th></tr>'+Tc.items.map(function(i){
        return '<tr><td><b>'+esc(i.place)+'</b></td><td>'+esc(i.metric)+'<br><span class="sub">'+esc(i.date.slice(5).replace('-','/'))+'</span></td><td class="r">'+fmt(i.value)+'</td><td class="r">'+(i.base==null?'-':fmt(i.base))+'</td><td class="r'+(i.flag?' bad':'')+'">'+pct(i.change_pct)+'</td></tr>'}).join('')+'</table></div>';
      if(Tc.all_count>Tc.items.length) h+='<p class="sub">지표 '+Tc.all_count+'개 중 변화가 큰 '+Tc.items.length+'개만 보여 줍니다.</p>';
    } else h+='<div class="empty">견줄 만큼 쌓인 숫자가 아직 없습니다. 같은 요일 2주 이상이 필요합니다.</div>';
    h+=src(Tc.rule_text, Tc.source);
  } else h+=missing('touchpoint_daily','접점 숫자')||'<div class="empty">접점 숫자 파일을 읽지 못했습니다. 위 실패 안내를 확인해 주세요.</div>';
  $('touch').innerHTML=h;

  // 주간 정리
  var Wk=B.weekly; h='<h3>주간 정리'+VT+'</h3>';
  if(Wk){
    h+='<div class="sub">'+esc(Wk.from)+' ~ '+esc(Wk.to)+', 주간 보고 초안. <a href="weekly.md">weekly.md 받기</a></div>';
    h+=Wk.sections.map(function(s){return '<p style="margin:8px 0 2px;font-weight:700">'+esc(s.title)+'</p><ul class="plain">'+s.lines.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>'}).join('');
    h+=src('주간 정리', Wk.source);
  } else h+='<div class="empty">주간 정리를 만들지 못했습니다.</div>';
  $('weekly').innerHTML=h;

  // 협의 초안
  var Cs=B.consult; h='<h3>협의 초안'+VT+'</h3><div class="sub">오늘 확인 필요 항목을 받는 사람별 메모로 묶었습니다. 보내기 전에 다듬어 씁니다.';
  if(Cs){
    h+=' <a href="consult.md">consult.md 받기</a></div>';
    if(Cs.drafts.length){
      h+=Cs.drafts.map(function(d,n){
        return '<details class="draft"'+(n===0?' open':'')+'><summary>'+esc(d.to)+' <span class="sub">'+d.count+'건</span>'
          +'<button class="copy" data-n="'+n+'">복사</button></summary><p class="memo">'+esc(d.text)+'</p></details>'}).join('');
    } else h+='<div class="empty">오늘은 협의할 확인 필요 항목이 없습니다.</div>';
    h+=src(Cs.rule_text, Cs.source);
  } else h+='</div><div class="empty">협의 초안을 만들지 못했습니다.</div>';
  $('consult').innerHTML=h;
  Array.prototype.forEach.call(document.querySelectorAll('#consult .copy'),function(b){
    b.addEventListener('click',function(e){
      e.preventDefault();
      var t=Cs.drafts[+b.getAttribute('data-n')].text;
      if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){b.textContent='복사됨'},function(){b.textContent='복사 안 됨'});
      else b.textContent='복사 안 됨';
    });
  });

  // 4.1
  var r=B.review; h='<h3>고객 접점 알림</h3>';
  if(r){
    h+='<div class="sub">'+esc(r.app_name||'앱')+' 1~2점 리뷰, '+esc(r.since)+' 이후'+(r.stale?' (지난 결과)':'')
      +'<span class="tag '+(r.status==='확인 필요'?'warn':'ok')+'">'+esc(r.status)+'</span></div>';
    h+='<div class="kpis"><div class="kpi '+(r.low_new?'o':'g')+'"><div class="l">새 1~2점</div><div class="n">'+r.low_new+'<small>건</small></div><div class="s">4주 하루 평균 '+r.avg28_per_day+'건, 차이 '+r.diff_vs_avg+'</div></div>'
      +'<div class="kpi '+(r.blocked_new?'o':'g')+'"><div class="l">새 막힘</div><div class="n">'+r.blocked_new+'<small>건</small></div><div class="s">혜택 단어와 로그인, 실행 오류 단어가 함께</div></div>'
      +'<div class="kpi"><div class="l">지난 7일 1~2점</div><div class="n">'+r.low_7d+'<small>건</small></div><div class="s">막힘 '+r.blocked_7d+'건</div></div></div>';
    if(r.totals30) h+='<p class="sub">최근 30일('+esc(r.totals30.from.slice(5).replace('-','/'))+'~'+esc(r.totals30.to.slice(5).replace('-','/'))+') 전체 리뷰 '+r.totals30.all+'건, 그중 1~2점 '+r.totals30.low+'건, 막힘 '+r.totals30.blocked+'건</p>';
    h+='<ul class="plain">'+Object.keys(r.topics_new).map(function(k){return '<li>'+esc(k)+' '+r.topics_new[k]+'건</li>'}).join('')+'</ul>';
    h+='<ul class="plain">'+r.reasons.map(function(x){return '<li>판단 근거: '+esc(x)+'</li>'}).join('')+'</ul>';
    h+=src(r.rule+' ('+esc(r.rule_text||'')+')', r.source+'. 리뷰 원문, 작성자, 리뷰 ID는 저장하지 않음');
  } else if(!SAMPLE) h+='<div class="empty">앱 리뷰 수집이 꺼져 있습니다. 설정 파일의 <code>[reviews] app_id</code> 에 Google Play 앱 ID를 적으면 켜집니다.</div>';
  else h+='<div class="sub">리뷰를 수집하지 못했고 지난 결과도 없습니다.</div>';
  $('c41').innerHTML=h;

  // 4.4
  var f=B.field; h='<h3>오늘 현장 점검 목록</h3><div class="sub">오늘 돌아볼 접점 최대 3곳</div>';
  if(f){
    h+='<table class="tbl"><tr><th>접점</th><th>볼 것</th><th>고른 이유</th></tr>'+f.items.map(function(i){
      return '<tr><td><b>'+esc(i.place)+'</b></td><td>'+esc(i.check)+'</td><td>'+esc(i.why)+'</td></tr>'}).join('')+'</table>';
    var lv=f.last_visits||{}, names=Object.keys(lv);
    if(names.length) h+='<p class="sub" style="margin-top:10px">마지막 방문 기록'+(SAMPLE?'(가상)':'')+': '+names.map(function(n){return esc(n)+' '+esc(lv[n].date.slice(5).replace('-','/'))+(lv[n].result&&lv[n].result!=='정상'?'('+esc(lv[n].result)+')':'')}).join(', ')+'</p>';
    else if(!f.logged) h+=missing('field_log','현장 기록');
    if((f.skipped||[]).length) h+='<p class="sub warnline">'+f.skipped.map(esc).join('<br>')+'. 접점 이름은 설정의 touchpoints 와 같게 적습니다.</p>';
    h+=src(f.rule, f.source+'. 갈 곳과 볼 것을 정하는 목록이며, 다녀온 뒤 field_log에 한 줄 적으면 다음 날 주기 판단에 들어감');
  }
  $('c44').innerHTML=h;

  // 4.2
  var c=B.calendar; h='<h3>이번 주 집객 달력</h3><div class="sub">날짜별 상황, 맞는 시범, 알릴 길과 시간. 알릴 길은 '+esc(c?c.channel_note:'')+'</div>';
  if(c){
    var P={}, PN=c.pilot_names||{}; Object.keys(PN).forEach(function(k){P[k]=k+'번 '+PN[k]});
    h+='<div class="scroll"><table class="tbl"><tr><th>날짜</th><th>상황</th><th>맞는 시범</th><th>알릴 길 후보</th><th>보낼 시간 후보</th><th>혜택 유형</th><th>근거</th></tr>'
      +c.days.map(function(x,i){return '<tr'+(i===0?' class="today"':'')+'><td class="d">'+x.date.slice(5).replace('-','/')+'</td><td>'+esc(x.situation.join(', '))+'</td><td>'
        +(x.pilots.length?x.pilots.map(function(p){return esc(P[p])}).join('<br>'):'없음')+'</td><td>'+(esc(x.channels.join(', '))||'-')+'</td><td>'+(esc(x.times.join(', '))||'-')
        +'</td><td>'+(esc(x.benefit)||'-')+'</td><td>'+esc(x.basis)+'</td></tr>'}).join('')+'</table></div>';
    h+=src(c.rule+', '+c.rain_rule, c.source);
  }
  $('c42').innerHTML=h;

  // 4.3
  var p=B.pilot; h='<h3>시범 점검'+(p&&p.virtual?'<span class="v">가상 데이터</span>':'')+'</h3>';
  if(p){
    h+='<div class="sub">1번 시범(평일 저녁 푸시), 시작 '+esc(p.start)+(p.virtual?'(가정값)':'')+', '+(p.check_day?'<span class="tag warn">'+esc(p.week_label)+'</span>':esc(p.week_label||''))+'</div>';
    if(p.sent){
      h+='<div class="kpis"><div class="kpi g"><div class="l">1인당 평일 저녁 방문</div><div class="n">'+(p.visit_diff>0?'+':'')+p.visit_diff+'<small>회</small></div><div class="s">받은 회원 '+p.visits_per_member_sent+', 남겨 둔 회원 '+p.visits_per_member_hold+'</div></div>'
        +'<div class="kpi '+(p.new_ratio>p.breakeven?'g':'o')+'"><div class="l">새 방문 비율</div><div class="n">'+p.new_ratio+'<small>%</small></div><div class="s">본전 '+p.breakeven+'%(가정값)</div></div>'
        +'<div class="kpi"><div class="l">푸시 수신 거부율</div><div class="n">'+p.optout_sent+'<small>%</small></div><div class="s">남겨 둔 회원 '+p.optout_hold+'%</div></div></div>';
    }
    h+='<p style="margin:6px 0;font-size:16px;font-weight:700;color:var(--green-d)">'+esc(p.decision)+'</p>';
    h+='<ul class="plain">'+(p.reasons||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
    if(p.sent) h+='<div class="sub">'+(p.virtual?'가상 ':'')+'회원 '+fmt(p.sent+p.hold)+'명, 받은 회원 '+fmt(p.sent)+'명, 남겨 둔 회원 '+fmt(p.hold)+'명</div>';
    h+=src(p.rule+' (넓힌다, 고쳐서 다시, 멈춘다 기준. 점검 주차 '+esc((p.check_weeks||[4,10]).join('주차와 '))+'주차)', p.source);
  } else h+=missing('pilot_weekly','시범 주별 집계')||'<div class="empty">시범 파일을 읽지 못했습니다. 위 실패 안내를 확인해 주세요.</div>';
  $('c43').innerHTML=h;

  // 지난 30일
  h='<h3>지난 30일 기록</h3><div class="sub">리뷰 작성일 기준 1~2점 건수와 막힘 건수</div>';
  var s=(r&&r.series30)||[];
  if(s.length){
    var W=960,H=130,pl=22,pb=22,bw=(W-pl)/s.length, mx=Math.max(2,Math.max.apply(null,s.map(function(x){return x.low})));
    var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="지난 30일 1~2점 리뷰와 막힘 건수">';
    for(var k=0;k<=mx;k+=Math.ceil(mx/2)){var y=H-pb-(H-pb-8)*k/mx; svg+='<g class="axis"><line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)"/><text x="'+(pl-6)+'" y="'+(y+3)+'" text-anchor="end">'+k+'</text></g>';}
    s.forEach(function(x,i){
      var x0=pl+i*bw+1, hl=(H-pb-8)*x.low/mx, hb=(H-pb-8)*x.blocked/mx;
      svg+='<rect x="'+x0+'" y="'+(H-pb-hl)+'" width="'+(bw-2)+'" height="'+hl+'" fill="var(--gray)"><title>'+x.date+' 1~2점 '+x.low+'건, 막힘 '+x.blocked+'건</title></rect>';
      if(hb) svg+='<rect x="'+x0+'" y="'+(H-pb-hb)+'" width="'+(bw-2)+'" height="'+hb+'" fill="var(--orange)"/>';
      if((s.length-1-i)%7===0) svg+='<text class="axis" x="'+(x0+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" fill="var(--muted)" font-size="10">'+x.date.slice(5).replace('-','/')+'</text>';
    });
    svg+='</svg>';
    var tl=s.reduce(function(a,x){return a+x.low},0), tb=s.reduce(function(a,x){return a+x.blocked},0);
    var T=r.totals30, Tp=r.totals_prev30;
    if(T) h+='<p class="sub"><b>최근 30일 전체 리뷰 '+T.all+'건, 1~2점 '+T.low+'건, 막힘 '+T.blocked+'건</b>'
      +(T.low===0?'. 지난 30일에는 1~2점 리뷰가 없어 막대가 비어 있습니다':'')
      +(Tp?'. 그 전 30일('+esc(Tp.from.slice(5).replace('-','/'))+'~'+esc(Tp.to.slice(5).replace('-','/'))+')은 전체 '+Tp.all+'건, 1~2점 '+Tp.low+'건, 막힘 '+Tp.blocked+'건':'')+'</p>';
    h+='<div class="legend"><span><i style="background:var(--gray)"></i>1~2점 '+tl+'건</span><span><i style="background:var(--orange)"></i>막힘 '+tb+'건</span></div><div class="chart">'+svg+'</div>';
  }
  var hs=(B.history||[]).slice().reverse();
  if(hs.length){
    h+='<div class="scroll"><table class="tbl" style="margin-top:10px"><tr><th>실행일</th><th>매출 판단</th><th class="r">전년 대비</th><th class="r">행사 경고</th><th>리뷰 판단</th><th class="r">새 1~2점</th><th>시범</th><th>실패</th></tr>'+hs.slice(0,7).map(function(x){
      return '<tr><td class="d">'+esc(x.date)+'</td><td>'+esc(x.sales_status||'-')+'</td><td class="r">'+pct(x.sales_yoy)+'</td><td class="r">'+(x.promo_warn==null?'-':x.promo_warn)+'</td><td>'+esc(x.status||'-')+'</td><td class="r">'+(x.low_new==null?'-':x.low_new)+'</td><td>'+esc(x.pilot||'-')+'</td><td>'+(esc((x.failures||[]).join(', '))||'-')+'</td></tr>'}).join('')+'</table></div>';
  }
  h+=src('4.1과 같은 단어 규칙, 실행 기록은 history 폴더(날짜별 집계만)', r?'Google Play 공개 리뷰, 원문 없이 건수만':'실행 기록');
  $('hist').innerHTML=h;
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>백화점 아침 점검</title>
<style>
:root{
  --bg:#f4f3ef; --card:#ffffff; --ink:#1e1e1e; --ink2:#4a4a4a; --muted:#767676; --line:#e4e2dc; --grid:#ecebe6;
  --green:#1e9d8b; --green-d:#13806f; --mint:#e3f3f0; --orange:#ca7700; --orange-d:#a86200; --warm:#f7e8cf;
  --gray:#c4c4c0; --virtual:#a86200; --virtual-bg:#f7e8cf; --band:#13806f; --band-ink:#ffffff; --band-sub:#d3eee9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131615; --card:#1c201f; --ink:#e8ebe9; --ink2:#c2c8c5; --muted:#949c99; --line:#2e3432; --grid:#262b29;
    --green:#26a491; --green-d:#5cc4b3; --mint:#173430; --orange:#c97f12; --orange-d:#e0a04a; --warm:#3a2c16;
    --gray:#4a514e; --virtual:#e0a04a; --virtual-bg:#3a2c16; --band:#0f5f53; --band-ink:#ffffff; --band-sub:#bfe5de;
  }
}
:root[data-theme="dark"]{
  --bg:#131615; --card:#1c201f; --ink:#e8ebe9; --ink2:#c2c8c5; --muted:#949c99; --line:#2e3432; --grid:#262b29;
  --green:#26a491; --green-d:#5cc4b3; --mint:#173430; --orange:#c97f12; --orange-d:#e0a04a; --warm:#3a2c16;
  --gray:#4a514e; --virtual:#e0a04a; --virtual-bg:#3a2c16; --band:#0f5f53; --band-ink:#ffffff; --band-sub:#bfe5de;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased; word-break:keep-all}
.wrap{max-width:1080px; margin:0 auto; padding:28px 24px 64px}
header.top{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:18px;
  background:var(--band); color:var(--band-ink); border-radius:12px; padding:22px 26px 20px; border-bottom:5px solid var(--orange)}
.brand{font-size:13px; font-weight:700; color:var(--band-sub)}
h1{font-size:26px; margin:4px 0 0; letter-spacing:-.02em}
.how{font-size:13px; color:var(--band-sub); margin-top:6px}
.meta{font-size:13px; color:var(--band-sub); text-align:right}
.theme-btn{margin-top:6px; background:none; border:1px solid var(--band-sub); color:var(--band-ink); border-radius:6px; padding:4px 10px; font:inherit; font-size:12px; cursor:pointer}
.headline{background:var(--card); border-left:6px solid var(--green); border-radius:10px; padding:18px 22px; margin-bottom:16px}
.headline .q{font-size:13px; color:var(--green-d); font-weight:700}
.headline ol{margin:6px 0 0; padding-left:22px; font-size:17px; font-weight:600; line-height:1.6}
.headline .sum{margin:10px 0 0; color:var(--ink2); font-size:14px}
.headline .by{font-size:12px; color:var(--muted)}
.alert{background:var(--warm); border-left:6px solid var(--orange); border-radius:10px; padding:12px 18px; margin-bottom:16px; font-size:14px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px}
.card{background:var(--card); border-radius:10px; padding:18px 20px 14px; min-width:0}
.card h3{font-size:16px; margin:0; padding-left:10px; border-left:4px solid var(--green); line-height:1.25}
.card .sub{font-size:13px; color:var(--muted); margin:2px 0 10px}
.v{font-size:11px; font-weight:700; color:var(--virtual); background:var(--virtual-bg); border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:2px}
.more{margin-top:8px; font:inherit; font-size:13px; color:var(--green-d); background:none; border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer}
.tag{display:inline-block; font-size:12px; font-weight:700; border-radius:4px; padding:1px 7px; margin-left:6px; vertical-align:2px}
.tag.ok{background:var(--mint); color:var(--green-d)} .tag.warn{background:var(--warm); color:var(--orange-d)}
.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:6px 0 8px}
.kpi{border-top:3px solid var(--gray); padding-top:6px}
.kpi.g{border-top-color:var(--green)} .kpi.o{border-top-color:var(--orange)}
.kpi .l{font-size:12.5px; color:var(--muted)}
.kpi .n{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums}
.kpi .n small{font-size:13px; font-weight:600; margin-left:2px}
.kpi .s{font-size:12px; color:var(--ink2)}
.kpi.g .n{color:var(--green-d)} .kpi.o .n{color:var(--orange-d)}
ul.plain{margin:4px 0; padding-left:18px; font-size:14px} ul.plain li{margin:3px 0}
.src{font-size:12px; color:var(--muted); border-top:1px solid var(--line); margin-top:10px; padding-top:8px}
.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
.tbl th,.tbl td{text-align:left; padding:7px 6px; border-bottom:1px solid var(--line); vertical-align:top}
.tbl th{font-size:12px; color:var(--muted); font-weight:600}
.tbl tr.today td{background:var(--mint)}
.tbl td.r,.tbl th.r{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.tbl td.bad{color:var(--orange-d); font-weight:700}
.warnline{display:block; font-size:12.5px; color:var(--orange-d); font-weight:600}
.empty{font-size:14px; color:var(--ink2); background:var(--bg); border-radius:8px; padding:12px 14px; margin-top:8px}
.empty code{font-size:13px}
.memo{white-space:pre-wrap; background:var(--bg); border-radius:8px; padding:10px 12px; font-size:13px; line-height:1.6; margin:6px 0 0}
.copy{font:inherit; font-size:12px; border:1px solid var(--line); background:var(--card); color:var(--ink2); border-radius:6px; padding:2px 8px; margin-left:8px; cursor:pointer}
details.draft{border-top:1px solid var(--line); padding:8px 0}
details.draft summary{cursor:pointer; font-weight:700}
details.archive{margin-top:12px}
details.archive summary{cursor:pointer; font-weight:700; font-size:14px}
.plans{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; margin-top:10px}
.plan{border:1px solid var(--line); border-top:3px solid var(--green); border-radius:8px; padding:12px 14px; font-size:13.5px; line-height:1.55}
.plan .pt{font-weight:700; font-size:15px} .plan .pw{color:var(--green-d); font-weight:700; font-size:13px; margin-bottom:6px}
.plan dl{margin:6px 0 0; display:grid; grid-template-columns:62px 1fr; gap:3px 8px} .plan dt{color:var(--muted); font-size:12.5px} .plan dd{margin:0}
.plan .note{margin-top:8px; font-size:12.5px; color:var(--orange-d)}
.tbl td.d{white-space:nowrap; font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.chart svg{display:block; width:100%; height:auto}
.axis text{fill:var(--muted); font-size:10px}
.legend{display:flex; gap:14px; font-size:12.5px; color:var(--ink2); margin:4px 0}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; margin-right:5px}
/* 탭과 한눈에 보기 */
.tabs{position:sticky; top:0; z-index:5; display:flex; gap:4px; overflow-x:auto; background:var(--bg); padding:8px 0 10px; margin-bottom:6px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto; font:inherit; font-size:14px; font-weight:700; color:var(--ink2); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 14px; cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--green-d); border-color:var(--green-d); color:var(--card)}
.tabs .n{display:inline-block; min-width:18px; margin-left:6px; padding:0 5px; border-radius:9px; font-size:11.5px; line-height:18px; text-align:center; background:var(--warm); color:var(--orange-d)}
.panel[hidden]{display:none}
.panel>section,.panel>.grid2{margin-bottom:16px}
.chips{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin:14px 0 4px}
.chip{display:block; text-align:left; font:inherit; cursor:pointer; background:var(--bg); border:1px solid var(--line); border-left:4px solid var(--green); border-radius:8px; padding:8px 10px; color:var(--ink)}
.chip.warn{border-left-color:var(--orange); background:var(--warm)}
.chip .l{font-size:12px; color:var(--muted)} .chip .x{font-size:14.5px; font-weight:700; margin-top:1px}
.chip.warn .x{color:var(--orange-d)}
.headline ol a{color:inherit; text-decoration:none; border-bottom:1px dashed var(--muted)}
.headline ol a:hover{color:var(--green-d)}
.acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.btn{font:inherit; font-size:13px; font-weight:600; border:1px solid var(--green-d); color:var(--green-d); background:var(--card); border-radius:6px; padding:5px 12px; cursor:pointer; text-decoration:none}
.todo{list-style:none; margin:8px 0 0; padding:0}
.todo li{display:flex; gap:10px; align-items:flex-start; padding:9px 2px; border-bottom:1px solid var(--line); font-size:14.5px}
.todo input{width:18px; height:18px; margin-top:2px; accent-color:var(--green-d); flex:0 0 auto}
.todo label{flex:1 1 auto; cursor:pointer}
.todo .k{flex:0 0 auto; font-size:11.5px; font-weight:700; color:var(--muted); background:var(--bg); border-radius:4px; padding:1px 6px; margin-top:2px}
.todo li.done span.t{color:var(--muted); text-decoration:line-through}
.todo a{flex:0 0 auto; color:var(--green-d)}
.prog{font-weight:700; color:var(--green-d)}
details.src{font-size:12px; color:var(--muted); border-top:1px solid var(--line); margin-top:10px; padding-top:6px}
details.src summary{cursor:pointer; list-style:none} details.src summary::-webkit-details-marker{display:none}
details.src summary:before{content:"+ "} details.src[open] summary:before{content:"- "}
details.src p{margin:4px 0 0}
details.how{margin-top:6px; font-size:13px; color:var(--band-sub)} details.how summary{cursor:pointer}
section{scroll-margin-top:64px}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--orange)}100%{box-shadow:0 0 0 0 transparent}}
@media print{
  .tabs,.theme-btn,.acts,.copy,.more{display:none!important} .panel[hidden]{display:block!important}
  body{background:#fff} .card,.headline{break-inside:avoid; border:1px solid #ddd} details.src{display:none}
}
footer{font-size:13px; color:var(--muted); text-align:center; margin-top:24px}
@media (max-width:760px){
  .wrap{padding:16px 16px 48px} .grid2{grid-template-columns:1fr} .meta{text-align:left}
  .kpis{grid-template-columns:repeat(3,1fr)} .kpi .n{font-size:22px} .headline ol{font-size:15.5px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand" id="brand">백화점 마케팅 아침 점검</div>
      <h1 id="title">아침 점검</h1>
      <details class="how"><summary>이 화면은 어떤 자료로 만드나요</summary><div id="how"></div></details>
    </div>
    <div class="meta"><div id="runat"></div><button class="theme-btn" id="theme">화면 밝기 바꾸기</button></div>
  </header>
  <div id="alerts"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="화면 나누기"></nav>
  <div class="panel" data-tab="today">
    <section class="headline">
      <div class="q">오늘 볼 것 세 가지</div>
      <ol id="top3"></ol>
      <p class="sum" id="summary"></p>
      <div class="by" id="by"></div>
      <div class="chips" id="chips"></div>
      <div class="acts"><button type="button" class="btn" id="sharecopy">아침 공유 글 복사</button><a class="btn" href="brief.md">brief.md 받기</a><button type="button" class="btn" id="printbtn">인쇄</button></div>
    </section>
    <section class="card" id="todo"></section>
    <section class="card" id="c44"></section>
  </div>
  <div class="panel" data-tab="numbers">
    <section class="card" id="sales"></section>
    <div class="grid2">
      <section class="card" id="touch"></section>
      <section class="card" id="c41"></section>
    </div>
    <section class="card" id="hist"></section>
  </div>
  <div class="panel" data-tab="work">
    <section class="card" id="promos"></section>
    <section class="card" id="tasks"></section>
    <section class="card" id="c42"></section>
  </div>
  <div class="panel" data-tab="plan">
    <section class="card" id="consult"></section>
    <section class="card" id="plan"></section>
    <section class="card" id="c43"></section>
  </div>
  <div class="panel" data-tab="week">
    <section class="card" id="weekly"></section>
  </div>
  <footer id="foot"></footer>
</div>
<script src="data.js"></script>
<script>
// 인터넷을 쓰지 않는 설정이면 외부 글꼴을 부르지 않고 PC 글꼴(맑은 고딕)을 쓴다
if(window.BRIEF&&!window.BRIEF.offline){var f=document.createElement('link');f.rel='stylesheet';f.href='https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css';document.head.appendChild(f);}
</script>
<script>
(function(){
  var root=document.documentElement, btn=document.getElementById('theme');
  try{var t=localStorage.getItem('theme'); if(t) root.setAttribute('data-theme',t);}catch(e){}
  btn.onclick=function(){
    var dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);
    var n=dark?'light':'dark'; root.setAttribute('data-theme',n); try{localStorage.setItem('theme',n);}catch(e){}
  };
  var B=window.BRIEF, $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function fmt(n){return n==null?'-':Number(n).toLocaleString('ko-KR')}
  if(!B){ $('top3').innerHTML='<li>브리핑 파일을 읽지 못했습니다. 저장소의 data/latest.json 을 확인해 주세요.</li>'; return; }
  var DOW='월화수목금토일';
  var d=new Date(B.date+'T00:00:00');
  $('title').textContent=B.date.replace(/-/g,'. ')+' ('+DOW[(d.getDay()+6)%7]+') 아침 점검';
  $('runat').textContent='실행 '+B.run_at.replace('T',' ').slice(0,16)+' KST';
  var SAMPLE=B.mode!=='real', VT=SAMPLE?'<span class="v">가상 데이터</span>':'';
  // 오늘 읽기에 실패해 지난 결과를 보여 주는 블록 표시
  var OLD=function(x){return x&&x.stale?'<span class="tag warn">'+esc(x.stale_from||'지난')+' 결과, 오늘 읽기 실패</span>':''};
  document.title=(B.store_name?B.store_name+' ':'')+'아침 점검';
  $('brand').textContent=SAMPLE?'백화점 마케팅 아침 점검 | 개인 포트폴리오 시연':'백화점 마케팅 아침 점검 | '+(B.store_name||'내 점포');
  $('how').textContent=SAMPLE
    ?'실제 자료로 도는 칸: 앱 리뷰(Google Play), 날씨 예보, 공휴일, 요일 근거(지하철 승하차 집계). 가상 칸: 매출, 행사, 접점 숫자, 시범, 현장 기록. 내 엑셀을 넣으면 가상 칸이 내 자료로 바뀝니다.'
    :'inputs 폴더의 내 엑셀로 만든 화면입니다. 내부 자료이니 외부에 공유하지 마세요.';
  var repo=B.repo_url?'<br>판단 규칙과 코드: <a href="'+esc(B.repo_url)+'">'+esc(B.repo_url.replace(/^https?:\/\//,''))+'</a>':'';
  $('foot').innerHTML=(SAMPLE?'공개 데이터와 가상 데이터만 씁니다. 현대백화점 내부 자료가 아닙니다.':'내 파일로 만든 점검입니다. 판단은 규칙 문장대로이며, 최종 결정은 담당자가 합니다.')+repo;
  var al='';
  if(B.error) al+='<div class="alert"><b>실행 실패</b> '+esc(B.error.at)+', 실패 단계 '+esc(B.error.step)+'. 아래는 마지막 성공('+esc(B.error.last_success)+') 결과입니다.</div>';
  (B.failures||[]).forEach(function(f){ al+='<div class="alert"><b>'+esc(f.step)+' 실패</b>'+(f.message?': '+esc(f.message):'')+'. 마지막 성공 '+esc(f.last_success||'없음')+', 해당 블록은 그때 결과이거나 비어 있습니다.</div>'; });
  $('alerts').innerHTML=al;
  $('top3').innerHTML=(B.top3||[]).map(function(t){return '<li>'+esc(t)+'</li>'}).join('');
  $('summary').textContent=B.summary||'';
  $('by').textContent='요약: '+(B.summary_by||'');
  function src(rule,s){return '<details class="src"><summary>판단 기준과 출처</summary><p>규칙 '+esc(rule)+'</p><p>출처 '+esc(s)+'</p></details>'}
  // 복사 단추. 글은 CP에 모아 두고 번호로 꺼낸다
  var CP=[];
  function cbtn(text,label){CP.push(text); return '<button type="button" class="copy" data-cp="'+(CP.length-1)+'">'+(label||'복사')+'</button>'}
  function copyText(t,b){
    var done=function(){b.textContent='복사됨'}, fail=function(){b.textContent='복사 안 됨'};
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(done,fail); else fail();
  }
  function pct(n){return n==null?'-':(n>0?'+':'')+n+'%'}
  function failed(what){
    return '<div class="empty">'+esc(what)+' 파일을 읽지 못했습니다. '+((B.failures||[]).length?'위 실패 안내의 행 번호와 열 이름을 고쳐 주세요.':'실행할 때 명령 창에 나온 안내를 확인해 주세요.')+'</div>';
  }
  function missing(name,what){
    if((B.empty||[]).indexOf(name+'.xlsx')>=0) return '<div class="empty"><b>'+esc(what)+'</b> 파일은 있지만 머리글 아래가 비어 있습니다. <code>inputs/'+esc(name)+'</code> 파일에 자료를 붙여 넣으면 다음 실행부터 나옵니다.</div>';
    if((B.missing||[]).indexOf(name+'.xlsx')<0) return '';
    return '<div class="empty"><b>'+esc(what)+'</b> 파일이 아직 없습니다. <code>inputs/'+esc(name)+'.xlsx</code>(또는 .csv)를 넣으면 다음 실행부터 나옵니다. 양식은 <code>python -m brief.init</code> 으로 만듭니다.</div>';
  }

  // 매출 현황
  var S=B.sales, h='<h3>매출 현황'+VT+OLD(S)+'</h3>';
  if(S){
    var t=S.total, m=S.mtd, w=S.last7;
    h+='<div class="sub">'+esc(S.date)+' 마감 기준'+(S.stale_days>1?' ('+S.stale_days+'일 전 자료)':'')
      +'<span class="tag '+(S.status==='확인 필요'?'warn':'ok')+'">'+esc(S.status)+'</span></div>'
      +(S.unit_note?'<div class="sub">'+esc(S.unit_note)+'</div>':'');
    function k(lab,n,unit,sub,cls){return '<div class="kpi '+(cls||'')+'"><div class="l">'+lab+'</div><div class="n">'+n+(unit?'<small>'+unit+'</small>':'')+'</div><div class="s">'+sub+'</div></div>'}
    var lowA=t.achieve_pct!=null&&t.achieve_pct<S.target_alert_pct, lowY=t.yoy_pct!=null&&t.yoy_pct<=S.yoy_alert_pct;
    h+='<div class="kpis">'+k('어제 매출',esc(t.sales_text),'','목표 '+(t.achieve_pct==null?'없음':t.achieve_pct+'%'),lowA?'o':'g')
      +k('전년 같은 요일 대비',t.yoy_pct==null?'-':pct(t.yoy_pct),'','최근 7일 '+pct(w.yoy_pct),lowY?'o':'g')
      +k('월 누계',esc(m.sales_text),'','목표 '+(m.achieve_pct==null?'-':m.achieve_pct+'%')+', 전년 대비 '+pct(m.yoy_pct))+'</div>';

  var Pl=B.plan; h='<h3>집객 기획 초안</h3><div class="sub">달력에서 시범마다 가장 가까운 날을 골라 대상, 문구, 재는 법까지 채운 초안입니다. 무엇을 할지는 담당자가 정합니다.';
  if(Pl){
    h+=' <a href="plan.md">plan.md 받기</a></div>';
    if(Pl.cards.length){
      h+='<div class="plans">'+Pl.cards.map(function(c){
        return '<div class="plan"><div class="pt">'+c.pilot+'번 '+esc(c.name)+'</div><div class="pw">'+esc(c.when)+'</div><dl>'
          +'<dt>왜 이날</dt><dd>'+esc(c.situation)+'. '+esc(c.basis)+'</dd>'
          +'<dt>누구에게</dt><dd>'+esc(c.target)+'</dd>'
          +'<dt>무엇을</dt><dd>'+esc(c.benefit)+'</dd>'
          +'<dt>알릴 길</dt><dd>'+esc(c.channels.join(', '))+'</dd>'
          +'<dt>문구 A</dt><dd>'+esc(c.copy_a)+cbtn(c.copy_a)+'</dd><dt>문구 B</dt><dd>'+esc(c.copy_b)+cbtn(c.copy_b)+'</dd>'
          +'<dt>재는 법</dt><dd>'+esc(c.measure)+'</dd><dt>맡을 곳</dt><dd>'+esc(c.owner)+'</dd></dl>'
          +c.notes.map(function(x){return '<div class="note">'+esc(x)+'</div>'}).join('')+'</div>'}).join('')+'</div>';
    } else h+='<div class="empty">이번 주 달력에 맞춰 볼 시범이 없습니다.</div>';
    h+=src(Pl.rule_text, Pl.source);
  } else h+='</div><div class="empty">기획 초안을 만들지 못했습니다.</div>';
  $('plan').innerHTML=h;

  // 4.3
  var p=B.pilot; h='<h3>시범 점검'+(p&&p.virtual?'<span class="v">가상 데이터</span>':'')+OLD(p)+'</h3>';
  if(p){
    h+='<div class="sub">1번 시범(평일 저녁 푸시), 시작 '+esc(p.start)+(p.virtual?'(가정값)':'')+', '+(p.check_day?'<span class="tag warn">'+esc(p.week_label)+'</span>':esc(p.week_label||''))+'</div>';
    if(p.sent){
      h+='<div class="kpis"><div class="kpi g"><div class="l">1인당 평일 저녁 방문</div><div class="n">'+(p.visit_diff>0?'+':'')+p.visit_diff+'<small>회</small></div><div class="s">받은 회원 '+p.visits_per_member_sent+', 남겨 둔 회원 '+p.visits_per_member_hold+'</div></div>'
        +'<div class="kpi '+(p.new_ratio>p.breakeven?'g':'o')+'"><div class="l">새 방문 비율</div><div class="n">'+p.new_ratio+'<small>%</small></div><div class="s">본전 '+p.breakeven+'%(가정값)</div></div>'
        +'<div class="kpi"><div class="l">푸시 수신 거부율</div><div class="n">'+p.optout_sent+'<small>%</small></div><div class="s">남겨 둔 회원 '+p.optout_hold+'%</div></div></div>';
    }
    h+='<p style="margin:6px 0;font-size:16px;font-weight:700;color:var(--green-d)">'+esc(p.decision)+'</p>';
    h+='<ul class="plain">'+(p.reasons||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
    if(p.sent) h+='<div class="sub">'+(p.virtual?'가상 ':'')+'회원 '+fmt(p.sent+p.hold)+'명, 받은 회원 '+fmt(p.sent)+'명, 남겨 둔 회원 '+fmt(p.hold)+'명</div>';
    h+=src(p.rule+' (넓힌다, 고쳐서 다시, 멈춘다 기준. 점검 주차 '+esc((p.check_weeks||[4,10]).join('주차와 '))+'주차)', p.source);
  } else h+=missing('pilot_weekly','시범 주별 집계')||failed('시범');
  $('c43').innerHTML=h;

  // 지난 30일
  h='<h3>지난 30일 기록</h3><div class="sub">리뷰 작성일 기준 1~2점 건수와 막힘 건수</div>';
  var s=(r&&r.series30)||[];
  if(s.length){
    var W=960,H=130,pl=22,pb=22,bw=(W-pl)/s.length, mx=Math.max(2,Math.max.apply(null,s.map(function(x){return x.low})));
    var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="지난 30일 1~2점 리뷰와 막힘 건수">';
    for(var k=0;k<=mx;k+=Math.ceil(mx/2)){var y=H-pb-(H-pb-8)*k/mx; svg+='<g class="axis"><line x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)"/><text x="'+(pl-6)+'" y="'+(y+3)+'" text-anchor="end">'+k+'</text></g>';}
    s.forEach(function(x,i){
      var x0=pl+i*bw+1, hl=(H-pb-8)*x.low/mx, hb=(H-pb-8)*x.blocked/mx;
      svg+='<rect x="'+x0+'" y="'+(H-pb-hl)+'" width="'+(bw-2)+'" height="'+hl+'" fill="var(--gray)"><title>'+x.date+' 1~2점 '+x.low+'건, 막힘 '+x.blocked+'건</title></rect>';
      if(hb) svg+='<rect x="'+x0+'" y="'+(H-pb-hb)+'" width="'+(bw-2)+'" height="'+hb+'" fill="var(--orange)"/>';
      if((s.length-1-i)%7===0) svg+='<text class="axis" x="'+(x0+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" fill="var(--muted)" font-size="10">'+x.date.slice(5).replace('-','/')+'</text>';
    });
    svg+='</svg>';
    var tl=s.reduce(function(a,x){return a+x.low},0), tb=s.reduce(function(a,x){return a+x.blocked},0);
    var T=r.totals30, Tp=r.totals_prev30;
    if(T) h+='<p class="sub"><b>최근 30일 전체 리뷰 '+T.all+'건, 1~2점 '+T.low+'건, 막힘 '+T.blocked+'건</b>'
      +(T.low===0?'. 지난 30일에는 1~2점 리뷰가 없어 막대가 비어 있습니다':'')
      +(Tp?'. 그 전 30일('+esc(Tp.from.slice(5).replace('-','/'))+'~'+esc(Tp.to.slice(5).replace('-','/'))+')은 전체 '+Tp.all+'건, 1~2점 '+Tp.low+'건, 막힘 '+Tp.blocked+'건':'')+'</p>';
    h+='<div class="legend"><span><i style="background:var(--gray)"></i>1~2점 '+tl+'건</span><span><i style="background:var(--orange)"></i>막힘 '+tb+'건</span></div><div class="chart">'+svg+'</div>';
  }
  var hs=(B.history||[]).slice().reverse();
  if(hs.length){
    h+='<div class="scroll"><table class="tbl" style="margin-top:10px"><tr><th>실행일</th><th>매출 판단</th><th class="r">전년 대비</th><th class="r">행사 경고</th><th>리뷰 판단</th><th class="r">새 1~2점</th><th>시범</th><th>실패</th></tr>'+hs.slice(0,7).map(function(x){
      return '<tr><td class="d">'+esc(x.date)+'</td><td>'+esc(x.sales_status||'-')+'</td><td class="r">'+pct(x.sales_yoy)+'</td><td class="r">'+(x.promo_warn==null?'-':x.promo_warn)+'</td><td>'+esc(x.status||'-')+'</td><td class="r">'+(x.low_new==null?'-':x.low_new)+'</td><td>'+esc(x.pilot||'-')+'</td><td>'+(esc((x.failures||[]).join(', '))||'-')+'</td></tr>'}).join('')+'</table></div>';
  }
  h+=src('4.1과 같은 단어 규칙, 실행 기록은 history 폴더(날짜별 집계만)', r?'Google Play 공개 리뷰, 원문 없이 건수만':'실행 기록');
  $('hist').innerHTML=h;

  // 오늘 볼 것을 해당 칸으로 잇는다
  function target(t){
    var m=[[/^업무/,'tasks'],[/^매출/,'sales'],[/^행사/,'promos'],[/^접점/,'touch'],[/^앱 리뷰/,'c41'],[/^오늘\(/,'c42']];
    for(var i=0;i<m.length;i++) if(m[i][0].test(t)) return m[i][1];
    return '';
  }
  $('top3').innerHTML=(B.top3||[]).map(function(t){var g=target(t); return '<li>'+(g?'<a href="#'+g+'" data-go="'+g+'">'+esc(t)+'</a>':esc(t))+'</li>'}).join('');

  // 오늘 할 일. 체크는 이 브라우저에만 날짜별로 남는다
  var todo=[];
  (B.top3||[]).forEach(function(t){ if(!/^(그 밖에|업무)/.test(t)) todo.push(['확인',t,target(t)]); });
  ((Tk&&!Tk.stale&&Tk.items)||[]).forEach(function(i){ if(i.left!=null&&i.left<=0) todo.push(['업무',i.name+' ('+i.phase+')','tasks']); });
  ((f&&f.items)||[]).forEach(function(i){ todo.push(['현장',i.place+': '+i.check,'c44']); });
  if(Cs&&Cs.drafts.length) todo.push(['협의',Cs.drafts.length+'명에게 협의 메모 보내기('+Cs.drafts.map(function(d){return d.to.replace(/ 담당$/,'')}).join(', ')+')','consult']);
  var seen={}; todo=todo.filter(function(x){if(seen[x[1]]) return false; seen[x[1]]=1; return true});
  var KEY='todo-'+B.date, done={};
  try{done=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
  function prog(){return todo.filter(function(x){return done[x[1]]}).length+' / '+todo.length+' 끝냄'}
  h='<h3>오늘 할 일</h3><div class="sub">오늘 볼 것, 오늘까지인 업무, 현장 점검, 보낼 협의 메모를 모았습니다. 체크는 이 PC 브라우저에만 남습니다. <span class="prog" id="prog">'+prog()+'</span></div>';
  h+=todo.length?'<ul class="todo">'+todo.map(function(x,n){
    return '<li'+(done[x[1]]?' class="done"':'')+'><input type="checkbox" id="td'+n+'"'+(done[x[1]]?' checked':'')+'><span class="k">'+esc(x[0])+'</span><label for="td'+n+'"><span class="t">'+esc(x[1])+'</span></label>'
      +(x[2]?'<a href="#'+x[2]+'" data-go="'+x[2]+'" class="sub">보기</a>':'')+'</li>'}).join('')+'</ul>':'<div class="empty">오늘 따로 챙길 일이 없습니다.</div>';
  $('todo').innerHTML=h;
  document.querySelectorAll('.todo input').forEach(function(c){
    c.onchange=function(){var t=todo[+c.id.slice(2)][1]; if(c.checked) done[t]=1; else delete done[t];
      c.parentNode.className=c.checked?'done':''; try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){} $('prog').textContent=prog();};
  });

  // 한눈에 보기
  var chips=[];
  if(S) chips.push(['매출', S.partial_pct!=null?'파일 다시 받기':(S.parts_flagged||[]).length?'구분 확인: '+S.parts_flagged.join(', '):S.status+(S.total.yoy_pct!=null?', 전년 '+pct(S.total.yoy_pct):''), S.status==='확인 필요'||(S.parts_flagged||[]).length>0, 'sales']);
  if(Pr) chips.push(['행사', Pr.warn_count?'경고 '+Pr.warn_count+'건':'경고 없음', Pr.warn_count>0, 'promos']);
  if(Tk) chips.push(['업무', Tk.overdue+Tk.due_today?'지남 '+Tk.overdue+'건, 오늘 '+Tk.due_today+'건':'열린 업무 '+Tk.items.length+'건', Tk.overdue+Tk.due_today>0, 'tasks']);
  if(Tc) chips.push(['접점 숫자', Tc.flagged.length?'평소와 다름 '+Tc.flagged.length+'건':'평소', Tc.flagged.length>0, 'touch']);
  if(r) chips.push(['앱 리뷰', r.status+', 새 1~2점 '+r.low_new+'건', r.status==='확인 필요', 'c41']);
  if(Cs) chips.push(['협의 메모', Cs.drafts.length?Cs.drafts.length+'명에게 보낼 것':'없음', false, 'consult']);
  if(p) chips.push(['시범', p.decision.split('(')[0], false, 'c43']);
  $('chips').innerHTML=chips.map(function(c){return '<button type="button" class="chip'+(c[2]?' warn':'')+'" data-go="'+c[3]+'"><div class="l">'+esc(c[0])+'</div><div class="x">'+esc(c[1])+'</div></button>'}).join('');

  // 탭. 숫자는 그 탭에서 확인이 필요한 건수
  var TABS=[['today','오늘'],['numbers','숫자'],['work','행사와 업무'],['plan','협의와 기획'],['week','주간 보고']];
  var warnN={numbers:(S&&(S.status==='확인 필요'||(S.parts_flagged||[]).length)?1:0)+(Tc?Tc.flagged.length:0)+(r&&r.status==='확인 필요'?1:0),
    work:(Pr?Pr.warn_count:0)+(Tk?Tk.overdue+Tk.due_today:0), plan:Cs?Cs.drafts.length:0};
  $('tabs').innerHTML=TABS.map(function(t){return '<button type="button" role="tab" data-t="'+t[0]+'">'+t[1]+(warnN[t[0]]?'<span class="n">'+warnN[t[0]]+'</span>':'')+'</button>'}).join('');
  function show(t){
    if(!TABS.some(function(x){return x[0]===t})) t='today';
    document.querySelectorAll('.panel').forEach(function(x){x.hidden=x.getAttribute('data-tab')!==t});
    document.querySelectorAll('#tabs button').forEach(function(b){b.setAttribute('aria-selected',b.getAttribute('data-t')===t)});
    try{localStorage.setItem('tab',t)}catch(e){}
  }
  function go(id){
    var el=$(id); if(!el) return;
    show(el.closest('.panel').getAttribute('data-tab'));
    el.scrollIntoView({behavior:'smooth',block:'start'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
  document.addEventListener('click',function(e){
    var t=e.target.closest('[data-t]'); if(t){show(t.getAttribute('data-t')); window.scrollTo({top:0}); return;}
    var g=e.target.closest('[data-go]'); if(g){e.preventDefault(); go(g.getAttribute('data-go')); return;}
    var c=e.target.closest('[data-cp]'); if(c){e.preventDefault(); copyText(CP[+c.getAttribute('data-cp')],c);}
  });
  var first='today'; try{first=localStorage.getItem('tab')||'today'}catch(e){}
  show(first);

  // 아침 공유 글. 메신저에 붙여 넣기 좋은 짧은 글
  var share=$('title').textContent+'\n'+(B.top3||[]).map(function(t,i){return (i+1)+'. '+t}).join('\n')+'\n\n'+(B.summary||'');
  $('sharecopy').onclick=function(){copyText(share,this)};
  $('printbtn').onclick=function(){window.print()};
})();
</script>
</body>
</html>

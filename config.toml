# 아침 점검 설정. 이 파일은 공개 시연용 기본값입니다.
# 내 업무에 쓸 때는 `python -m brief.init` 으로 config.local.toml 을 만들어 그 파일만 고칩니다.
# config.local.toml 과 inputs/, output/ 은 .gitignore 에 들어 있어 저장소에 올라가지 않습니다.

[run]
# sample: 가상 매출, 가상 행사, 가상 시범으로 화면을 만들고 docs/ 와 data/ 에 씁니다(공개 시연).
# real: inputs/ 폴더의 내 파일을 읽고 output/ 폴더에만 씁니다.
mode = "sample"
store_name = "여의도 플래그십(가상)"
# Claude 요약(allow_llm). 적지 않으면 sample 모드는 켜짐, real 모드는 꺼짐입니다.
# real 모드에서 켜면 매출 같은 내부 숫자가 외부 API로 나가므로 config.local.toml 에서만 켭니다.
# offline = true 이면 인터넷에 전혀 나가지 않습니다(리뷰와 날씨 수집을 건너뛰고 요일과 공휴일로만 달력을 만듦).
# 회사 PC에서 외부 접속이 막혀 있거나 IT 승인 전이면 켭니다.
# 알림 웹훅 주소를 담은 환경변수 이름(Slack, Teams 수신 웹훅). 비어 있으면 보내지 않습니다.
webhook_env = "BRIEF_WEBHOOK_URL"
# 알림 끝에 붙일 대시보드 주소. real 모드는 사내에서 여는 output/site 주소를 config.local.toml 에 적습니다.
dashboard_url = "https://jhheo51-arch.github.io/dept-morning-brief/"
# 화면 맨 아래 저장소 링크. 비우면 표시하지 않습니다.
repo_url = "https://github.com/jhheo51-arch/dept-morning-brief"

[reviews]
# Google Play 앱 ID. 비우면 리뷰 블록을 건너뜁니다.
app_id = "com.ehyundai.mcard"
app_name = "현대백화점 앱"
alert_multiple = 2.0      # 새 1~2점이 지난 4주 하루 평균의 몇 배를 넘으면 확인 필요
alert_blocked = 1         # 막힘 리뷰가 몇 건 이상이면 확인 필요

[weather]
lat = 37.5216             # 점포 좌표(Open-Meteo 예보)
lon = 126.9242
rain_mm = 3               # 낮(10~20시) 강수 합이 이 값 이상이면 비 오는 날

[calendar]
# 요일별 판단 근거 문장. 내 점포 숫자가 있으면 바꿔 씁니다.
weekday_basis = "평일 17~20시 여의도역 승차 16,483명(포트폴리오 4쪽 집계)"
saturday_basis = "토요일 하차 31,905명으로 휴일 중 가장 많아 따로 부르지 않음"
sunday_basis = "일요일 하차 22,602명, 토요일보다 29% 적음"
rain_holiday_basis = "비 온 휴일 여의도역 하차 1.02배(같은 달 휴일 중앙값 대비)"
weekday_time = "당일 17시"
sunday_time = "전날 18시"
weekday_benefit = "식품관 저녁 혜택, 문화센터 저녁 클래스"
saturday_benefit = "브랜드 할인"
# {행사} 자리에는 행사 파일에서 그날 끝나는 행사 이름이 들어갑니다. 그날 끝나는 행사가 없으면 no_ending_benefit 을 씁니다
sunday_benefit = "{행사} 마지막 날, 마감 안내"
no_ending_benefit = "문화센터 원데이 클래스, 식품관 혜택(그날 끝나는 행사 없음)"
rain_benefit = "실내 행사, 문화센터 원데이 클래스"
channels = ["앱 푸시", "문자나 메신저 알림", "매장 안내물(사이니지, VMD)", "문화센터 공지"]
channel_note = "후보, 운영 여부 확인 필요"
# 공휴일은 holidays 라이브러리(대한민국)로 자동 계산합니다. 점포 휴점일이나 지역 행사일은 여기에 더합니다.
extra_holidays = {}

[pilots]
1 = "평일 17~20시 퇴근길"
2 = "일요일, 비 오는 날은 지하로"
3 = "부르기 전에, 막히는 곳부터"

[sources]
# 사내 BI나 공유 폴더가 파일을 날마다 떨어뜨리면 그 경로를 적습니다. 그러면 inputs/ 에 붙여 넣지 않아도 됩니다.
# 패턴에 맞는 xlsx, csv 중 가장 최근 파일을 읽고, 그 파일이 오늘 전에 바뀌었으면 화면 맨 위에 알립니다.
# 공개 시연(sample)에서는 쓰지 않습니다. 예)
# sales = "D:/BI_export/일매출_*.xlsx"
# touchpoint_daily = "%USERPROFILE%/Downloads/접점일보_*.csv"

[columns]
# 사내 시스템에서 내려받은 파일의 열 이름이 양식과 다를 때 적습니다. 파일은 손대지 않고 그대로 넣으면 됩니다.
# 형식: [columns.파일이름] 아래 "표준 열 이름" = ["사내 열 이름", ...]  (한글 이름은 따옴표로 감쌉니다)
# 예)
# [columns.sales]
# "날짜" = ["매출일자", "일자"]
# "구분" = ["상품군"]
# "매출" = ["순매출액"]

[sales]
# inputs/sales 파일의 매출 판단 기준
yoy_alert_pct = -10       # 전년 같은 요일 대비 이 % 이하이면 확인 필요
target_alert_pct = 90     # 목표 달성률이 이 % 미만이면 확인 필요
total_name = "전체"       # 파일에 이 구분이 없으면 나머지 구분을 더해 만듭니다
# 매출, 목표, 전년 금액 단위. "원", "천원", "만원", "백만원" 중 하나. 열 이름이 '매출(천원)'이면 그 단위를 먼저 따릅니다
unit = "원"
# 덜 된 집계(중간 집계) 파일 가리기. 해당하면 구분 경고를 멈추고 파일을 다시 받으라고 알립니다
# confirm_hour: 어제 매출이 오늘 몇 시에 확정되는지(사내 BI 마감 시각). 적으면 매출 파일을 받은 시각으로 가리고, 아래 partial_pct는 쓰지 않습니다
# confirm_hour = 6
# 시각을 적지 않았을 때: 어제 매출이 최근 4주 같은 요일 평균의 이 % 미만이면 덜 된 집계로 봅니다(가정값)
# 50이면 반쯤 들어온 파일을 놓치고, 높일수록 실제 하락(휴점, 큰 비)을 파일 탓으로 돌리는 일이 늘어납니다. 시범 4주 동안 오경보를 세어 고칩니다
partial_pct = 80

[promotions]
lookahead_days = 7        # 며칠 뒤 시작하는 행사까지 볼지
vmd_ready_days = 3        # 시작 며칠 전까지 VMD 협의가 끝나야 하는지
# VMD 상태 칸에 이 단어가 들어 있으면 끝난 것으로 봅니다('완료(10/30)', '설치완료'도 끝남)
done_words = ["완료", "확정"]
# 이 단어가 들어 있으면 시작 D-기준보다 일찍이라도 바로 알립니다(협의할 시간이 필요해서)
not_started_words = ["요청 전", "요청전", "미요청"]
# 행사 성과: 행사 기간 매출을 바로 앞 같은 요일 기간과 견줍니다(장보기 주기와 요일 차이를 맞추려고)
result_days = 14          # 끝난 뒤 며칠까지 성과를 보여 줄지
result_low_pct = -5       # 직전 같은 요일 기간 대비 이 % 이하이면 확인 필요(가정값). 0이면 조금만 낮아도 알림
# 행사 파일에 '목표'(행사 기간 전체의 그 구분 매출 목표)를 적으면 목표 대비로도 봅니다.
# 진행 중이면 남은 날도 지금까지 하루 평균대로 간다고 본 예상, 끝났으면 실제 달성률이 이 % 미만일 때 확인 필요
# 예상은 남은 날의 앞 같은 요일 매출에 지금까지의 배율(행사 기간 매출 / 앞 같은 요일 매출)을 곱해 더한 값입니다
target_low_pct = 95       # (가정값)
target_min_days = 3       # 시작 며칠째부터 예상으로 알릴지. 그 전에는 숫자만 보여 줌
# 판단 기울기: 행사 구분 증가율에서 같은 기간 다른 구분 증가율을 뺀 차이가 이 %p 이상이면 이어 가기 검토,
# 마이너스 이 값 이하면 멈춤 검토, 그 사이면 고쳐서 다시 검토. 행사 효과를 확정하는 값이 아닙니다
lean_gap_pp = 3           # (가정값)

[touchpoint_daily]
# 문화센터, 라운지, 상담실 같은 접점의 하루 숫자(inputs/touchpoint_daily)
change_pct = 30           # 어제 값이 직전 4주 같은 요일 평균보다 이 % 이상 늘거나 줄면 표시(가정값)
min_value = 5             # 평소 값이 이보다 작으면 % 판단을 하지 않음(작은 숫자는 흔들림이 큼)
max_rows = 8

[tasks]
# 마케팅 업무 목록(inputs/tasks). 업무는 엑셀에 행을 더해 넣고, 끝나면 상태 칸에 '완료'를 적습니다
done_words = ["완료", "끝", "취소"]   # 상태 칸에 이 단어가 들어 있으면 보관 목록으로 옮김
soon_days = 3             # 기한이 며칠 남았을 때부터 'D-n'으로 앞에 올릴지
max_rows = 10             # 화면에 보여 줄 열린 업무 수
archive_days = 90         # 보관 목록을 완료일 기준 며칠까지 남길지
me = ["나", "본인"]        # 담당 칸에 이 말이 있으면 내 업무. 다른 담당의 기한 임박 업무는 협의 초안에 넣음

[weekly]
# 주간 정리 끝의 '다음 주 점검'. 업무 기한, 시작 전 경고가 남은 행사, 끝난 행사 결과 보고는 자동으로 들어가고
# 아래는 매주 같은 요일에 하는 점검입니다. "요일: 할 일" 꼴로 적고 내 팀 일정으로 바꿔 쓰세요(예시)
checks = ["월: 주간 매출 보고", "수: 다음 주 행사 문구 확정", "금: 다음 주 행사 VMD 상태 확인"]

[plan]
# 집객 기획 초안. 이번 주 달력에서 시범별로 가장 가까운 날을 골라 포트폴리오 6쪽 양식으로 채웁니다.
# 아래 문장은 초안 재료일 뿐이고, 무엇을 할지는 담당자가 정합니다. 내 팀 문구로 바꿔 씁니다.
max_cards = 3
[plan.1]
target = "최근 6개월 평일 17~20시 결제가 있고, 최근 60일(가정값) 평일 저녁 방문이 1회 이하인 회원"
copy_a = "오늘 19시까지 식품관에서 결제하면 포인트를 더 드려요. 여의도역 지하에서 바로 오세요."
copy_b = "오늘 18시 원데이 클래스에 남은 자리가 있어요. 퇴근길에 들러 보세요."
measure = "대상 회원 10%는 보내지 않고, 1인당 평일 저녁 방문 차이를 봅니다"
owner = "회원서비스, 판매기획"
[plan.2]
target = "앱 푸시 수신에 동의한 회원 전체, 1번에서 남겨 둔 10%는 뺌(대상 좁히기는 1번 결과를 본 뒤)"
# {행사} 자리는 그날 끝나는 행사 이름으로 채웁니다. 끝나는 행사가 없으면 _none 문장을 씁니다
copy_a = "이번 일요일이 {행사} 마지막 날이에요. 여의도역 지하에서 바로 오세요."
copy_a_none = "이번 일요일 문화센터 원데이 클래스에 자리가 남아 있어요(확인 후). 여의도역 지하에서 바로 오세요."
# 그날 비 예보가 있으면 문구 A 대신 씁니다
copy_a_rain = "일요일에 비 소식이 있어요. {행사} 마지막 날, 여의도역에서 우산 없이 오세요."
copy_a_rain_none = "일요일에 비 소식이 있어요. 여의도역에서 우산 없이 오세요."
copy_b = "{행사}, 이번 일요일까지예요. 문화센터 원데이 클래스도 함께 열려요."
copy_b_none = "이번 일요일 식품관 혜택과 문화센터 원데이 클래스를 함께 즐겨 보세요(확인 후)."
measure = "행사 일요일 10번의 여의도역 하차를 같은 달 일요일 중앙값과 비교합니다"
owner = "판매기획"
[plan.3]
target = "최근 7일 막힘 리뷰에 나온 접점을 쓰는 회원"
copy_a = "앱이 열리지 않을 때도 계산대에서 휴대폰 번호로 혜택을 받을 수 있어요(가능 여부 확인 후)."
copy_b = "주차 정산은 앱 바코드 없이 차량 번호로도 할 수 있어요(가능 여부 확인 후)."
measure = "점검 목록을 모두 통과해야 1, 2번을 시작합니다"
owner = "디지털 담당 부서, 점포 고객센터"

[consult]
# 협의 초안을 받는 사람 호칭. 팀에서 부르는 이름으로 바꿉니다
vmd = "VMD 담당"
channel = "채널 담당"
app = "앱 운영 담당"
# 협의 메모를 직접 보낼 사람. 나머지(영업 구분, 접점, 다른 팀 업무, 앱 운영)는 메모 대신 팀장 보고 한 장의 다른 팀 확인 요청에 싣습니다
direct = ["VMD 담당", "채널 담당"]

[pilot]
# 시범 결과 파일(inputs/pilot_weekly)이 없으면 가상 시범으로 계산합니다.
start = 2026-10-12        # 가정값
weeks = 10
check_weeks = [4, 10]
breakeven_pct = 25        # 본전: 혜택 1건 5,000원 / 새 방문 1회 2만 원(가정값)

[field]
max_items = 3
# 정기 점검 접점. every_days 일 넘게 현장 기록이 없으면 목록에 올립니다.
touchpoints = [
  { name = "우수고객 라운지", every_days = 7, check = "앱이 안 열릴 때 회원 확인을 받는 다른 방법이 안내되어 있는가" },
  { name = "문화센터", every_days = 7, check = "당일 남은 자리 안내가 보이는가" },
  { name = "고객 상담실", every_days = 7, check = "최근 늘어난 문의 유형이 있는가, 앱 혜택 문의가 몇 건인가" },
  { name = "고객센터", every_days = 14, check = "앱이 안 열려도 휴대폰 번호로 혜택을 받는 길이 안내되어 있는가" },
  { name = "주차 정산기", every_days = 14, check = "앱 바코드 없이 정산하는 방법 안내가 있는가" },
  { name = "웨이팅 접수대", every_days = 14, check = "앱 없이 대기 등록하는 방법이 보이는가" },
  { name = "계산대", every_days = 14, check = "앱 쿠폰이 안 열릴 때 직원이 휴대폰 번호로 혜택을 조회할 수 있는가" },
  { name = "지하 연결 입구", every_days = 14, check = "여의도역에서 들어오는 퇴근 동선에 저녁 혜택 안내물이 보이는가" },
  { name = "팝업 행사장", every_days = 7, check = "행사 마지막 날과 사은행사 마감 안내가 입구에서 보이는가" },
]
